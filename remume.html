<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REMUME - Medicamentos SP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; padding: 16px; max-width: 800px; margin: auto; }
        header { background: linear-gradient(135deg, #0055CC, #003399); color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        header h1 { font-size: 24px; font-weight: 700; }
        header p { font-size: 14px; opacity: 0.8; margin-top: 4px; }
        .filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .filtro { background: #e0e7f0; padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: none; transition: 0.2s; }
        .filtro.ativo { background: #0055CC; color: white; }
        .busca { width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; margin-bottom: 16px; background: white; }
        .busca:focus { outline: none; border-color: #0055CC; box-shadow: 0 0 0 3px rgba(0,85,204,0.1); }
        .categorias { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .categoria { background: #f0f2f5; padding: 4px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .categoria.ativo { background: #0055CC; color: white; border-color: #0055CC; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); border-left: 4px solid #0055CC; }
        .card h3 { font-size: 16px; color: #1a1a1a; }
        .card .info { font-size: 13px; color: #666; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; }
        .card .info span { background: #f0f2f5; padding: 2px 10px; border-radius: 12px; }
        .sem-resultados { text-align: center; padding: 40px; color: #999; font-size: 16px; }
        .nivel { font-size: 11px; padding: 2px 10px; border-radius: 12px; background: #e8f0fe; color: #0055CC; }
        .gestacao { font-size: 11px; padding: 2px 10px; border-radius: 12px; background: #fce4ec; color: #c62828; }
        .gestacao.seguro { background: #e8f5e9; color: #2e7d32; }
        .back { display: inline-block; margin-top: 20px; color: #0055CC; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<header>
    <h1>💊 REMUME – Medicamentos SP</h1>
    <p>UBS · AMA · UPA · PSA · Emergência</p>
</header>

<!-- FILTROS RÁPIDOS -->
<div class="filtros">
    <button class="filtro ativo" data-filtro="todos">📋 Todos</button>
    <button class="filtro" data-filtro="UBS">🏥 UBS</button>
    <button class="filtro" data-filtro="AMA">🏥 AMA</button>
    <button class="filtro" data-filtro="UPA">🚑 UPA</button>
    <button class="filtro" data-filtro="PSA">🏨 PSA</button>
    <button class="filtro" data-filtro="Emergencia">🚨 Emergência</button>
    <button class="filtro" data-filtro="gestacao">🤰 Gestação</button>
</div>

<!-- BUSCA -->
<input type="text" id="busca" class="busca" placeholder="Digite o nome do medicamento (ex: Amoxicilina, Paracetamol)..." oninput="filtrar()">

<!-- CATEGORIAS -->
<div class="categorias" id="categoriasContainer">
    <button class="categoria ativo" data-categoria="todos">Todos</button>
    <button class="categoria" data-categoria="Analgésicos / Antitérmicos">Analgésicos</button>
    <button class="categoria" data-categoria="Anti-histamínicos">Anti-histamínicos</button>
    <button class="categoria" data-categoria="Anti-inflamatórios (AINEs)">AINEs</button>
    <button class="categoria" data-categoria="Antibióticos">Antibióticos</button>
    <button class="categoria" data-categoria="Antiespasmódicos">Antiespasmódicos</button>
    <button class="categoria" data-categoria="Antifúngicos">Antifúngicos</button>
    <button class="categoria" data-categoria="Antiparasitários">Antiparasitários</button>
    <button class="categoria" data-categoria="Antivirais">Antivirais</button>
    <button class="categoria" data-categoria="Cardiovascular">Cardiovascular</button>
    <button class="categoria" data-categoria="Dermatológico">Dermatológico</button>
    <button class="categoria" data-categoria="Endócrino / Hormônios">Endócrino</button>
    <button class="categoria" data-categoria="Gastrointestinal">Gastrointestinal</button>
    <button class="categoria" data-categoria="Neurológico / Psiquiátrico">Neurológico</button>
    <button class="categoria" data-categoria="Oftálmicos">Oftálmicos</button>
    <button class="categoria" data-categoria="Outros / Diversos">Outros</button>
    <button class="categoria" data-categoria="Respiratório">Respiratório</button>
    <button class="categoria" data-categoria="Vitaminas e Suplementos">Vitaminas</button>
</div>

<!-- LISTA DE MEDICAMENTOS -->
<div id="listaMedicamentos"></div>

<a href="javascript:history.back()" class="back">⬅ Voltar para o app principal</a>

<script>
    // ===== BASE DE DADOS (medicamentos) =====
    const medicamentos = [
        // EXEMPLOS (você deve substituir pela sua lista completa)
        { nome: 'Amoxicilina', via: 'Oral', categoria: 'Antibióticos', nivel: ['UBS','AMA','UPA'], gestacao: 'seguro' },
        { nome: 'Azitromicina', via: 'Oral', categoria: 'Antibióticos', nivel: ['UBS','AMA','UPA'], gestacao: 'cautela' },
        { nome: 'Paracetamol', via: 'Oral', categoria: 'Analgésicos / Antitérmicos', nivel: ['UBS','AMA','UPA','PSA','Emergencia'], gestacao: 'seguro' },
        { nome: 'Dipirona', via: 'Oral', categoria: 'Analgésicos / Antitérmicos', nivel: ['UBS','AMA','UPA','PSA'], gestacao: 'cautela' },
        { nome: 'Dipirona', via: 'Injetável', categoria: 'Analgésicos / Antitérmicos', nivel: ['UPA','PSA','Emergencia'], gestacao: 'cautela' },
        { nome: 'Ibuprofeno', via: 'Oral', categoria: 'Anti-inflamatórios (AINEs)', nivel: ['UBS','AMA','UPA'], gestacao: 'cautela' },
        { nome: 'Diclofenaco', via: 'Oral', categoria: 'Anti-inflamatórios (AINEs)', nivel: ['UBS','AMA','UPA'], gestacao: 'cautela' },
        { nome: 'Diclofenaco', via: 'Injetável', categoria: 'Anti-inflamatórios (AINEs)', nivel: ['UPA','PSA'], gestacao: 'cautela' },
        { nome: 'Omeprazol', via: 'Oral', categoria: 'Gastrointestinal', nivel: ['UBS','AMA','UPA'], gestacao: 'seguro' },
        { nome: 'Metoclopramida', via: 'Oral', categoria: 'Gastrointestinal', nivel: ['UBS','AMA','UPA','PSA'], gestacao: 'cautela' },
        { nome: 'Metoclopramida', via: 'Injetável', categoria: 'Gastrointestinal', nivel: ['UPA','PSA','Emergencia'], gestacao: 'cautela' },
        { nome: 'Ondansetrona', via: 'Oral', categoria: 'Gastrointestinal', nivel: ['UBS','AMA','UPA','PSA'], gestacao: 'seguro' },
        { nome: 'Ondansetrona', via: 'Injetável', categoria: 'Gastrointestinal', nivel: ['UPA','PSA','Emergencia'], gestacao: 'seguro' },
        { nome: 'Salbutamol', via: 'Inalatória', categoria: 'Respiratório', nivel: ['UBS','AMA','UPA','PSA'], gestacao: 'seguro' },
        { nome: 'Budesonida', via: 'Inalatória', categoria: 'Respiratório', nivel: ['UBS','AMA','UPA'], gestacao: 'seguro' },
        { nome: 'Prednisona', via: 'Oral', categoria: 'Endócrino / Hormônios', nivel: ['UBS','AMA','UPA','PSA'], gestacao: 'cautela' },
        { nome: 'Loratadina', via: 'Oral', categoria: 'Anti-histamínicos', nivel: ['UBS','AMA','UPA'], gestacao: 'seguro' },
        { nome: 'Metformina', via: 'Oral', categoria: 'Endócrino / Hormônios', nivel: ['UBS','AMA','UPA'], gestacao: 'seguro' },
        { nome: 'Insulina NPH', via: 'Injetável', categoria: 'Endócrino / Hormônios', nivel: ['UBS','AMA','UPA','PSA','Emergencia'], gestacao: 'seguro' },
        { nome: 'Insulina Regular', via: 'Injetável', categoria: 'Endócrino / Hormônios', nivel: ['UBS','AMA','UPA','PSA','Emergencia'], gestacao: 'seguro' },
        { nome: 'Captopril', via: 'Oral', categoria: 'Cardiovascular', nivel: ['UBS','AMA','UPA'], gestacao: 'cautela' },
        { nome: 'Losartana', via: 'Oral', categoria: 'Cardiovascular', nivel: ['UBS','AMA','UPA'], gestacao: 'cautela' },
        { nome: 'Furosemida', via: 'Oral', categoria: 'Cardiovascular', nivel: ['UBS','AMA','UPA'], gestacao: 'cautela' },
        { nome: 'Furosemida', via: 'Injetável', categoria: 'Cardiovascular', nivel: ['UPA','PSA','Emergencia'], gestacao: 'cautela' },
        { nome: 'Hidralazina', via: 'Injetável', categoria: 'Cardiovascular', nivel: ['UPA','PSA','Emergencia'], gestacao: 'seguro' },
        { nome: 'Escopolamina', via: 'Oral', categoria: 'Antiespasmódicos', nivel: ['UBS','AMA','UPA'], gestacao: 'cautela' },
        { nome: 'Escopolamina', via: 'Injetável', categoria: 'Antiespasmódicos', nivel: ['UPA','PSA','Emergencia'], gestacao: 'cautela' },
        // Adicione aqui todos os medicamentos da sua lista
    ];

    let filtroNivel = 'todos';
    let filtroCategoria = 'todos';

    function filtrar() {
        const termo = document.getElementById('busca').value.toLowerCase().trim();
        const container = document.getElementById('listaMedicamentos');
        
        let resultados = medicamentos.filter(m => {
            // Filtro por nível
            if (filtroNivel === 'gestacao') {
                if (m.gestacao !== 'seguro') return false;
            } else if (filtroNivel !== 'todos') {
                if (!m.nivel.includes(filtroNivel)) return false;
            }
            // Filtro por categoria
            if (filtroCategoria !== 'todos' && m.categoria !== filtroCategoria) return false;
            // Filtro por nome
            if (termo && !m.nome.toLowerCase().includes(termo)) return false;
            return true;
        });

        if (resultados.length === 0) {
            container.innerHTML = `<div class="sem-resultados">Nenhum medicamento encontrado.</div>`;
            return;
        }

        container.innerHTML = resultados.map(m => `
            <div class="card">
                <h3>${m.nome}</h3>
                <div class="info">
                    <span>💉 ${m.via}</span>
                    <span>📂 ${m.categoria}</span>
                    <span class="nivel">🏥 ${m.nivel.join(' / ')}</span>
                    ${m.gestacao === 'seguro' ? '<span class="gestacao seguro">🤰 Seguro</span>' : ''}
                    ${m.gestacao === 'cautela' ? '<span class="gestacao">🤰 Cautela</span>' : ''}
                </div>
            </div>
        `).join('');
    }

    // Eventos dos filtros
    document.querySelectorAll('.filtro').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filtro').forEach(b => b.classList.remove('ativo'));
            this.classList.add('ativo');
            filtroNivel = this.dataset.filtro;
            filtrar();
        });
    });

    document.querySelectorAll('.categoria').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.categoria').forEach(b => b.classList.remove('ativo'));
            this.classList.add('ativo');
            filtroCategoria = this.dataset.categoria;
            filtrar();
        });
    });

    // Inicializar
    filtrar();
</script>

</body>
</html>
